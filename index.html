<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirador Buzz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#000;--card:#0b0f1a;--tx:#f2f7ff;--mut:#8fa3c4;--bd:#16294d;--blue:#1e90ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.logo{font-size:22px;font-weight:800;margin:4px 0 12px;background:linear-gradient(90deg,#1e90ff,#0057d9,#00c2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec{font-size:19px;margin:18px 0 10px}
.demo{border:2px dashed #ffc21a;border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:14px;padding:14px;min-height:84px;color:#fff;font-weight:800;font-size:15px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.tile span{font-size:26px}
.hs{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px}
.art{text-align:center;min-width:76px;cursor:pointer;font-size:13px;font-weight:600}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;margin:0 auto 6px}
.art .av{width:70px;height:70px;font-size:22px}
input{width:100%;padding:13px 14px;font-size:16px;border:2px solid var(--bd);border-radius:30px;background:var(--card);color:var(--tx)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:12px 0}
.chip{display:flex;align-items:center;gap:8px;white-space:nowrap;background:var(--card);color:var(--tx);border:2px solid var(--bd);padding:6px 14px 6px 6px;font-size:14px;font-weight:600;border-radius:30px;cursor:pointer}
.chip .av{width:28px;height:28px;font-size:11px;margin:0}
.hero{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;margin-bottom:12px;color:#fff}
.hero .av{width:72px;height:72px;font-size:26px;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7);flex:none;margin:0}
.hero h2{font-size:22px;margin:0 0 8px}
.btn{border:0;border-radius:30px;padding:9px 16px;font-size:14px;font-weight:700;background:#fff;color:#2a1140;cursor:pointer}
.trk{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer}
.trk .cv{width:44px;height:44px;border-radius:8px;flex:none}
.trk b{display:block;font-size:15px}
.trk small{color:var(--mut)}
.trk .pl{margin-left:auto;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:16px;padding:14px;margin-bottom:12px}
.card.click{cursor:pointer}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700;font-size:14px}
.who .av{width:28px;height:28px;font-size:11px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:8px}
.type{background:var(--c);color:#fff;font-weight:700;padding:3px 10px;border-radius:20px}
.card h3{font-size:16px;margin:0 0 4px}
.card p{margin:0 0 8px;font-size:14px;color:var(--mut)}
.src{font-size:12px;color:var(--mut)}
.lis{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.lis a{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-weight:700;font-size:15px;padding:13px 16px;border-radius:14px}
.lis a small{margin-left:auto;opacity:.85;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#mp{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:544px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 10px 10px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#mp .r{display:flex;align-items:center;gap:10px}
#mp .cv{width:40px;height:40px;border-radius:8px;flex:none;background:linear-gradient(135deg,#1e90ff,#00c2ff)}
#mp .t{flex:1;min-width:0}
#mp .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mp .t small{color:var(--mut);font-size:12px}
#pp{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,#1e90ff,#0057d9);color:#fff;font-size:16px;cursor:pointer}
.bar{height:4px;background:var(--bd);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1e90ff,#0057d9)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:12px;font-weight:600;cursor:pointer}
nav button span{display:block;font-size:21px}
nav button.on{color:#1e90ff}

.ph{display:block;border-radius:50%;object-fit:cover;margin:0 auto 6px;flex:none}
.hero .ph{border:3px solid rgba(255,255,255,.7);margin:0}
.chip .ph{margin:0}
.trk .cv{object-fit:cover}
.trk .ph{margin:0}
.err{color:var(--mut);font-size:14px;padding:8px 2px}
#mp{display:none}

.brand{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.brand svg{width:52px;height:52px;flex:none}
.brand b{font-size:22px;letter-spacing:.5px;color:#fff}
.brand b i{font-style:normal;color:#1e90ff}
.brand small{display:block;color:var(--mut);font-size:12px}
body.out .wrap,body.out nav,body.out #mp{display:none!important}
body:not(.out) #auth{display:none}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.ac{width:100%;max-width:400px}
.ah{text-align:center;margin-bottom:18px}
.ah h1{font-size:26px;margin:10px 0 6px;color:#fff}
.ah h1 i{font-style:normal;color:#1e90ff}
.ah p{color:var(--mut);font-size:14px;margin:0}
.at{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:30px;padding:4px;margin-bottom:14px}
.at button{flex:1;background:none;color:var(--mut);padding:10px;border-radius:26px}
.at button.on{background:linear-gradient(135deg,#1e90ff,#0057d9);color:#fff}
#auth input{display:block;width:100%;margin-bottom:10px;border-radius:14px}
.ag{width:100%;margin-top:4px;background:linear-gradient(135deg,#1e90ff,#0057d9)}
.agg{width:100%;background:#fff;color:#111}
.ag:disabled,.agg:disabled{opacity:.6}
.as{text-align:center;color:var(--mut);margin:12px 0;font-size:13px}
.ae{color:#ff6b6b;font-size:14px;margin:2px 0 6px}
.ao{color:#4ade80;font-size:14px;margin:2px 0 6px}
.af{display:block;text-align:right;color:#1e90ff;font-size:14px;margin:6px 0 0}
.an{color:var(--mut);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body class="out">
<div id="auth"></div>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 64 64" role="img" aria-label="Mirador Buzz">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c2ff"/><stop offset="1" stop-color="#1e5bff"/></linearGradient></defs>
      <rect width="64" height="64" rx="16" fill="#000" stroke="#1e90ff" stroke-width="2"/>
      <path d="M13 28 C13 12 51 12 51 28" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="9" y="26" width="8" height="14" rx="3.5" fill="url(#lg)"/>
      <rect x="47" y="26" width="8" height="14" rx="3.5" fill="url(#lg)"/>
      <path d="M20 54 V30 L32 43 L44 30 V54" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div><b>MIRADOR <i>BUZZ</i></b><small>L'actu de vos artistes</small></div>
  </div>
  <div id="view"></div>
</div>
<div id="mp">
  <div class="r"><img class="cv" id="cv" alt=""><div class="t"><b id="mt"></b><small id="ms"></small></div><button id="pp">⏸</button></div>
  <div class="bar"><i id="pg"></i></div>
</div>
<nav>
  <button id="n0" class="on"><span>🏠</span>Accueil</button>
  <button id="n1"><span>🔍</span>Recherche</button>
  <button id="n2"><span>📚</span>Bibliothèque</button>
</nav>
<script>
var API="/api/music";
var ARTISTS=["Didi B","Josey","Burna Boy","Tiakola","Fally Ipupa","Tems"];
var GRADS=[["#1e90ff","#0057d9"],["#00c2ff","#1e5bff"],["#0a3d91","#1e90ff"],["#1a1f3a","#1e90ff"],["#00a3ff","#001f5c"],["#2b6dff","#00e0ff"]];
var LISTS=[["🔥","Afrobeats"],["💃","Coupé-Décalé"],["🎹","Amapiano"],["🎤","Rap ivoire"],["🪘","Rumba"],["🙏","Gospel"]];

var view=document.getElementById("view");
var favs=[];var UID="";
try{favs=JSON.parse(localStorage.getItem("favs2")||"[]");}catch(e){favs=[];}
function saveF(){try{localStorage.setItem("favs2_"+UID,JSON.stringify(favs));}catch(e){}}
function isFav(a){return favs.some(function(f){return f.id===a.id;});}
function toggleFav(a){var i=-1;favs.forEach(function(f,k){if(f.id===a.id)i=k;});if(i>-1)favs.splice(i,1);else favs.push({id:a.id,name:a.name,picture:a.picture,link:a.link});saveF();}
function g(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%GRADS.length;return GRADS[h];}
function grad(n){var x=g(n);return "linear-gradient(135deg,"+x[0]+","+x[1]+")";}
function ini(n){var p=n.trim().split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase();}
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e;}
function enc(s){return encodeURIComponent(s);}
function jget(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function avatar(n,size){var a=el("div","av",ini(n));a.style.background=grad(n);if(size){a.style.width=a.style.height=size+"px";a.style.fontSize=Math.round(size/3)+"px";}return a;}
function pic(a,size){
  if(a.picture){
    var i=document.createElement("img");i.src=a.picture;i.alt=a.name;i.className="ph";i.loading="lazy";
    i.style.width=i.style.height=size+"px";
    i.onerror=function(){if(i.parentNode)i.parentNode.replaceChild(avatar(a.name,size),i);};
    return i;
  }
  return avatar(a.name,size);
}

/* Lecteur : extraits de 30 secondes fournis par Deezer */
var au=new Audio(),mp=document.getElementById("mp"),pp=document.getElementById("pp"),pg=document.getElementById("pg");
function playTrack(t,name){
  if(!t.preview){window.open(t.link,"_blank","noopener");return;}
  au.src=t.preview;au.play().catch(function(){});
  document.getElementById("mt").textContent=t.title;
  document.getElementById("ms").textContent=name+" · extrait de 30 s";
  var cv=document.getElementById("cv");cv.src=t.cover||"";
  mp.style.display="block";pp.textContent="⏸";
}
pp.onclick=function(){if(au.paused){au.play();pp.textContent="⏸";}else{au.pause();pp.textContent="▶";}};
au.addEventListener("timeupdate",function(){if(au.duration)pg.style.width=(au.currentTime/au.duration*100)+"%";});
au.addEventListener("ended",function(){pp.textContent="▶";pg.style.width="0";});

var PLATS=[["🟢","Spotify","#1db954","https://open.spotify.com/search/"],["🟠","Audiomack","#ff8a00","https://audiomack.com/search?q="],["▶️","YouTube Music","#e62117","https://music.youtube.com/search?q="]];
function listen(a,apple){
  var w=el("div","lis");
  function btn(icon,label,color,href,tag){
    var x=el("a");x.href=href;x.target="_blank";x.rel="noopener noreferrer";x.style.background=color;
    x.appendChild(el("span","",icon));x.appendChild(el("span","","Écouter sur "+label));x.appendChild(el("small","",tag));w.appendChild(x);
  }
  if(a.link)btn("💜","Deezer","#a238ff",a.link,"Page de l'artiste ↗");
  if(apple)btn("🍎","Apple Music","#fa2d48",apple,"Page de l'artiste ↗");
  else btn("🍎","Apple Music","#fa2d48","https://music.apple.com/search?term="+enc(a.name),"Recherche ↗");
  PLATS.forEach(function(p){btn(p[0],p[1],p[2],p[3]+enc(a.name),"Recherche ↗");});
  return w;
}

function ago(d){
  if(!d)return "";
  var m=Math.round((Date.now()-new Date(d).getTime())/60000);
  if(isNaN(m)||m<0)return "";
  if(m<60)return "il y a "+Math.max(m,1)+" min";
  var h=Math.round(m/60);if(h<24)return "il y a "+h+" h";
  var j=Math.round(h/24);if(j===1)return "hier";if(j<31)return "il y a "+j+" j";
  return "";
}
function newsItem(it,a,withWho){
  var c=el("div","card click");c.style.setProperty("--c","#1e90ff");
  if(withWho&&a){
    var w=el("div","who");w.appendChild(pic(a,28));w.appendChild(el("span","",a.name));
    w.onclick=function(ev){ev.stopPropagation();tab(1);artist(a);};c.appendChild(w);
  }
  var top=el("div","top");top.appendChild(el("span","type","📰 "+(it.source||"Actualité")));top.appendChild(el("span","",ago(it.date)));c.appendChild(top);
  c.appendChild(el("h3","",it.title));
  c.appendChild(el("div","src","Lire l'article ↗"));
  c.onclick=function(){window.open(it.link,"_blank","noopener");};
  return c;
}
function loadNews(names,box,withWho,max){
  box.innerHTML="";box.appendChild(el("div","err","Chargement des actualités…"));
  Promise.all(names.map(function(a){
    return jget("/api/news?q="+enc(a.name)).then(function(d){return (d.items||[]).map(function(it){return {it:it,a:a};});}).catch(function(){return [];});
  })).then(function(lists){
    var all=[].concat.apply([],lists).sort(function(x,y){return new Date(y.it.date||0)-new Date(x.it.date||0);});
    box.innerHTML="";
    if(!all.length){box.appendChild(el("div","err","Aucune actualité récente trouvée pour le moment."));return;}
    all.slice(0,max).forEach(function(o){box.appendChild(newsItem(o.it,o.a,withWho));});
  });
}

function home(){
  view.innerHTML="";
  view.appendChild(el("h2","sec","Pour vous"));
  var gr=el("div","grid");
  LISTS.forEach(function(l,i){
    var t=el("div","tile");t.style.background="linear-gradient(135deg,"+GRADS[i][0]+","+GRADS[i][1]+")";
    t.appendChild(el("span","",l[0]));t.appendChild(document.createTextNode(l[1]));
    t.onclick=function(){window.open("https://open.spotify.com/search/"+enc("playlist "+l[1]),"_blank","noopener");};
    gr.appendChild(t);
  });
  view.appendChild(gr);
  view.appendChild(el("h2","sec","Artistes populaires"));
  var hs=el("div","hs");
  var objs=ARTISTS.map(function(n){return {name:n};});
  objs.forEach(function(a){
    var d=el("div","art");var slot=el("div");slot.appendChild(avatar(a.name,70));d.appendChild(slot);d.appendChild(document.createTextNode(a.name));
    d.onclick=function(){tab(1);artist(a);};hs.appendChild(d);
    jget(API+"?q="+enc(a.name)+"&limit=1").then(function(r){
      var f=r.artists&&r.artists[0];if(!f)return;
      a.id=f.id;a.picture=f.picture;a.link=f.link;slot.innerHTML="";slot.appendChild(pic(a,70));
    }).catch(function(){});
  });
  view.appendChild(hs);
  view.appendChild(el("h2","sec","🔥 À la une"));
  var nbox=el("div");view.appendChild(nbox);
  loadNews(objs,nbox,true,12);
}

var timer=null;
function search(){
  view.innerHTML="";
  var q=document.createElement("input");q.type="search";q.placeholder="Cherchez un artiste du monde entier";q.autocomplete="off";
  view.appendChild(q);
  var res=el("div");res.id="res";res.style.marginTop="12px";view.appendChild(res);
  res.appendChild(el("div","empty","🎤 Tapez le nom d'un artiste."));
  function run(){
    var v=q.value.trim();if(!v){res.innerHTML="";res.appendChild(el("div","empty","🎤 Tapez le nom d'un artiste."));return;}
    res.innerHTML="";res.appendChild(el("div","empty","Recherche…"));
    jget(API+"?q="+enc(v)).then(function(d){
      res.innerHTML="";
      if(!d.artists||!d.artists.length){res.appendChild(el("div","empty","Aucun artiste trouvé."));return;}
      d.artists.forEach(function(a){
        var r=el("div","trk");r.appendChild(pic(a,48));
        var tx=el("div");tx.appendChild(el("b","",a.name));tx.appendChild(el("small","",a.fans?(a.fans.toLocaleString("fr-FR")+" fans"):"Artiste"));r.appendChild(tx);
        r.onclick=function(){artist(a);};res.appendChild(r);
      });
    }).catch(function(){res.innerHTML="";res.appendChild(el("div","empty","Connexion impossible. Réessayez."));});
  }
  q.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(run,400);});
  q.addEventListener("keydown",function(e){if(e.key==="Enter"){clearTimeout(timer);run();}});
}

function artist(a){
  if(!a.id){
    jget(API+"?q="+enc(a.name)+"&limit=1").then(function(r){if(r.artists&&r.artists[0])artist(r.artists[0]);}).catch(function(){});
    return;
  }
  var res=document.getElementById("res");
  if(!res){view.innerHTML="";res=el("div");res.id="res";view.appendChild(res);}
  res.style.marginTop="0";res.innerHTML="";
  var hero=el("div","hero");hero.style.background=grad(a.name);
  hero.appendChild(pic(a,72));
  var box=el("div");box.appendChild(el("h2","",a.name));
  var f=el("button","btn");
  function lab(){f.textContent=isFav(a)?"⭐ Suivi":"+ Suivre";}
  f.onclick=function(){toggleFav(a);lab();};lab();
  box.appendChild(f);hero.appendChild(box);res.appendChild(hero);
  var body=el("div");body.appendChild(el("div","empty","Chargement…"));res.appendChild(body);
  window.scrollTo(0,0);
  jget(API+"?id="+a.id+"&name="+enc(a.name)).then(function(d){
    body.innerHTML="";
    body.appendChild(el("h2","sec","Écouter "+a.name));
    body.appendChild(listen(a,d.apple));
    body.appendChild(el("h2","sec","Titres populaires"));
    if(!d.tracks||!d.tracks.length)body.appendChild(el("div","err","Aucun titre trouvé."));
    (d.tracks||[]).forEach(function(t){
      var r=el("div","trk");
      var cv=document.createElement("img");cv.className="cv";cv.src=t.cover||"";cv.alt="";cv.loading="lazy";r.appendChild(cv);
      var tx=el("div");tx.appendChild(el("b","",t.title));tx.appendChild(el("small","",t.album||a.name));r.appendChild(tx);
      r.appendChild(el("span","pl","▶"));
      r.onclick=function(){playTrack(t,a.name);};body.appendChild(r);
    });
    body.appendChild(el("div","err","Extraits de 30 secondes fournis par Deezer. Pour écouter en entier, utilisez les boutons ci-dessus."));
    body.appendChild(el("h2","sec","Actualités de "+a.name));
    var nb=el("div");body.appendChild(nb);
    loadNews([a],nb,false,10);
  }).catch(function(){
    body.innerHTML="";body.appendChild(listen(a,null));body.appendChild(el("div","err","Les titres n'ont pas pu être chargés."));
  });
}

function lib(){
  view.innerHTML="";view.appendChild(el("h2","sec","Ma bibliothèque"));
  var ab=el("div","card");ab.style.setProperty("--c","#1e90ff");ab.appendChild(el("p","",window.mbEmail?("Connecté : "+window.mbEmail):"Connecté"));
  var lo=el("button","btn","Se déconnecter");lo.style.background="#1e90ff";lo.style.color="#fff";lo.onclick=function(){if(window.mbLogout)window.mbLogout();};ab.appendChild(lo);view.appendChild(ab);
  if(!favs.length){view.appendChild(el("div","empty","⭐ Vous ne suivez encore aucun artiste. Allez dans Recherche et touchez « Suivre »."));return;}
  favs.forEach(function(a){
    var r=el("div","trk");r.appendChild(pic(a,48));
    var tx=el("div");tx.appendChild(el("b","",a.name));tx.appendChild(el("small","","Artiste suivi"));r.appendChild(tx);
    r.onclick=function(){tab(1);artist(a);};view.appendChild(r);
  });
}

function tab(i){
  for(var k=0;k<3;k++)document.getElementById("n"+k).className=k===i?"on":"";
  if(i===0)home();else if(i===1)search();else lib();
  window.scrollTo(0,0);
}
document.getElementById("n0").onclick=function(){tab(0);};
document.getElementById("n1").onclick=function(){tab(1);};
document.getElementById("n2").onclick=function(){tab(2);};
window.startApp=function(uid){UID=uid;try{favs=JSON.parse(localStorage.getItem("favs2_"+uid)||"[]");}catch(e){favs=[];}tab(0);};
window.stopApp=function(){au.pause();mp.style.display="none";};
</script>
<script type="module" src="auth.js"></script>
</body>
</html>
